spring.application.name=transfer-processing-service

# Database (defaults match compose.yaml; override with env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/transfers}
spring.datasource.username=${DB_USERNAME:transfers}
spring.datasource.password=${DB_PASSWORD:transfers}

# Liquibase owns the schema; Hibernate only checks that entities match it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Liquibase runs every changeset when no context is set, so name one explicitly.
# Seed data is tagged "dev" and only loads with the dev profile.
spring.liquibase.contexts=default
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
# A publish only counts once the broker confirms it and routed it to a queue
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Transactional outbox relay
outbox.relay.poll-ms=200
outbox.relay.batch-size=50
outbox.relay.confirm-timeout-ms=5000
outbox.relay.max-backoff-ms=30000

# Partners authenticate with API keys only; no default in-memory user
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Provider callbacks are signed with HMAC-SHA256 using this shared secret
provider.callback-secret=${PROVIDER_CALLBACK_SECRET:dev-callback-secret}

# Mock payment provider
mock.provider.callback-url=http://localhost:${local.server.port:${server.port:8080}}/api/v2/provider/events
mock.provider.callback-secret=${provider.callback-secret}
mock.provider.callback-delay-ms=500
mock.provider.delayed-callback-ms=5000
mock.provider.slow-response-ms=5000
mock.provider.callback-poll-ms=200
mock.provider.callback-max-attempts=10

# Actuator
management.endpoints.web.exposure.include=health,info
