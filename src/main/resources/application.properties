spring.application.name=transfer-processing-service

# Database (defaults match compose.yaml; override with env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/transfers}
spring.datasource.username=${DB_USERNAME:transfers}
spring.datasource.password=${DB_PASSWORD:transfers}

# Liquibase owns the schema; Hibernate only checks that entities match it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Provider callbacks are signed with HMAC-SHA256 using this shared secret
provider.callback-secret=${PROVIDER_CALLBACK_SECRET:dev-callback-secret}

# Mock payment provider
mock.provider.callback-url=http://localhost:${local.server.port:${server.port:8080}}/api/v2/provider/events
mock.provider.callback-secret=${provider.callback-secret}
mock.provider.callback-delay-ms=500
mock.provider.delayed-callback-ms=5000
mock.provider.slow-response-ms=5000
mock.provider.callback-poll-ms=200
mock.provider.callback-max-attempts=10

# Actuator
management.endpoints.web.exposure.include=health,info
