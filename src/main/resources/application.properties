spring.application.name=transfer-processing-service

# Database (defaults match compose.yaml; override with env vars in other environments)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/transfers}
spring.datasource.username=${DB_USERNAME:transfers}
spring.datasource.password=${DB_PASSWORD:transfers}

# Liquibase owns the schema; Hibernate only checks that entities match it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator
management.endpoints.web.exposure.include=health,info
